name: Prisma Migrate (Direct DB)

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "prisma.config.ts"
      - ".github/workflows/prisma-migrate.yml"

concurrency:
  group: prisma-migrate-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ✅ Make DATABASE_URL available to *all* steps including npm ci + postinstall
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Prisma migrate status (debug)
        if: always()
        run: npx prisma migrate status
