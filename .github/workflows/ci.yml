name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Validate environment variables
        run: npm run validate:env
        env:
          # Dummy values for validation only (not used in actual build)
          DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.test
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_example
          CLERK_SECRET_KEY: sk_test_example
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          HEIRVAULT_TOKEN_SECRET: test-token-secret-minimum-32-characters-long

      - name: Build Next.js application
        env:
          # Dummy values for build-time only (Next.js needs these for static analysis)
          DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.test
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_example
          CLERK_SECRET_KEY: sk_test_example
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          HEIRVAULT_TOKEN_SECRET: test-token-secret-minimum-32-characters-long
        run: npm run build
