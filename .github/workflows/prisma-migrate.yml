name: Prisma Migrate (Direct DB)

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "prisma.config.ts"
      - ".github/workflows/prisma-migrate.yml"

concurrency:
  group: prisma-migrate-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Optional but helpful: ensures Prisma engine/client is present and schema parsing works
      - name: Prisma generate
        run: npx prisma generate
        env:
          # Force Prisma to use direct DB inside CI for all CLI ops
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy
        env:
          # CRITICAL: use the *direct* Supabase host/port 5432 (IPv6-capable)
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

      - name: Prisma migrate status (debug)
        if: always()
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
