name: Prisma Migrate

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "prisma.config.ts"
      - ".github/workflows/prisma-migrate.yml"

concurrency:
  group: prisma-migrate-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DOTENV_CONFIG_QUIET: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify DATABASE_URL is present
        run: |
          test -n "$DATABASE_URL" && echo "DATABASE_URL is set" || (echo "DATABASE_URL missing" && exit 1)

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Prisma migrate status (debug)
        if: always()
        run: npx prisma migrate status
